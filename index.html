<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOCUS-B | Gomitas Energéticas de Guayusa</title>
    <style>
        :root { --verde-selva: #2ec4b6; --morado-colibri: #7209b7; --fucsia-brillante: #f72585; --azul-electrico: #3a0ca3; --blanco: #ffffff; --gris-oscuro: #1a1a1a; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8f9fa; color: var(--gris-oscuro); line-height: 1.6; }
        header { background: linear-gradient(135deg, var(--azul-electrico), var(--morado-colibri), var(--fucsia-brillante)); color: var(--blanco); text-align: center; padding: 3rem 1rem; }
        header h1 { font-size: 3rem; font-weight: 800; }
        .container { max-width: 1000px; margin: -2rem auto 3rem auto; padding: 0 1rem; }
        .product-card { background: var(--blanco); border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; }
        @media (max-width: 768px) { .product-card { grid-template-columns: 1fr; } }
        .product-image { display: flex; align-items: center; justify-content: center; padding: 1rem; }
        .product-image img { max-width: 100%; height: auto; border-radius: 12px; }
        .product-info { padding: 2.5rem; }
        .price { font-size: 2.5rem; font-weight: 800; color: var(--gris-oscuro); margin: 1rem 0; }
        .btn-buy { display: inline-block; background: linear-gradient(90deg, #10b981, var(--morado-colibri)); color: var(--blanco); padding: 1rem 2rem; border-radius: 50px; text-decoration: none; font-weight: bold; }
        .btn-buy:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <header><h1>FOCUS-B</h1><p>Gomitas Energéticas de Guayusa</p></header>
    <div class="container">
        <div class="product-card">
            <div class="product-image">
                <!-- Imagen actualizada aquí -->
                <img src="gomitas.png" alt="Gomitas FOCUS-B">
            </div>
            <div class="product-info">
                <h2>Energía Natural</h2>
                <div class="price">$2.50</div>
                <!-- WhatsApp link configurado -->
                <a href="https://wa.me" target="_blank" class="btn-buy">Pedir por WhatsApp</a>
            </div>
        </div>
    </div>
</body>
</html>
